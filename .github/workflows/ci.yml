name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php: [php84, php85]

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - run: nix develop .#${{ matrix.php }} --command composer install

      - run: nix develop .#${{ matrix.php }} --command composer test

      - run: nix develop .#${{ matrix.php }} --command composer analyze

      - name: Upload coverage to Coveralls
        if: matrix.php == 'php84'
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          nix develop .#php84 --command composer coverage
          nix develop .#php84 --command vendor/bin/php-coveralls --coverage_clover=coverage/clover.xml --json_path=coverage/coveralls-upload.json -v
